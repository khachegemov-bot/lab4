spring.application.name=24023
server.port=8080

# ---------- Подключение к БД ----------
# Секреты (адрес БД, логин, пароль) НЕ хранятся в коде и в git.
# Они читаются из файла .env в корне проекта (он в .gitignore) или из переменных окружения.
# Образец файла — .env.example.
spring.config.import=optional:file:.env[.properties]

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# Схему (таблицы, ограничения, права) создаёт администратор SQL-скриптами из папки db/.
# Приложение работает под пользователем без прав на DDL, поэтому Hibernate
# только ПРОВЕРЯЕТ, что сущности совпадают с таблицами, и ничего не создаёт.
spring.jpa.hibernate.ddl-auto=validate
# Не держать соединение с БД открытым до конца HTTP-запроса
spring.jpa.open-in-view=false
# все таблицы лежат в схеме city
spring.jpa.properties.hibernate.default_schema=city
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# ---------- Безопасность API ----------
# Неизвестные поля в JSON -> 400 Bad Request.
# Защита от mass assignment: клиент не сможет передать id, createdAt, status и т.п.
spring.jackson.deserialization.fail-on-unknown-properties=true

# Не отдавать клиенту стек-трейсы и внутренние сообщения ошибок
server.error.include-stacktrace=never
server.error.include-message=never
server.error.include-binding-errors=never

# ---------- Аутентификация и авторизация (Spring Security) ----------
# Сколько неверных паролей подряд допускается и на сколько после этого блокируется вход
app.security.max-failed-attempts=5
app.security.lock-duration=15m
# С каких сайтов браузеру разрешено обращаться к API (CORS). Пусто = ни с каких чужих.
# Пример: app.cors.allowed-origins=http://localhost:3000
app.cors.allowed-origins=
